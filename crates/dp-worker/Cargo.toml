[package]
name = "dp-worker"
version.workspace = true
edition.workspace = true
description = "Worker que reclama jobs de la cola y ejecuta el motor"

[lib]
name = "dp_worker"
path = "src/lib.rs"

[[bin]]
name = "dp-worker"
path = "src/main.rs"

[dependencies]
