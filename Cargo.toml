# Raíz del workspace. No es un paquete: solo agrupa los crates de `members`
# y centraliza las versiones de las dependencias.
[workspace]
members = [
    "crates/dp-core",
    "crates/dp-cli",
    "crates/dp-dominio",
    "crates/dp-memoria",
    "crates/dp-persistencia",
    "crates/dp-api",
    "crates/dp-worker",
]
resolver = "3"

# Metadatos que los crates heredan con `version.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"

# Un único lugar donde fijar versiones. Así dos crates del workspace no pueden
# terminar usando versiones distintas de la misma librería.
[workspace.dependencies]
csv = "1.4.0"
# Hasher no criptográfico. El de la librería estándar (SipHash) está endurecido
# contra ataques de colisión que aquí no aplican, y cuesta CPU que sí notamos.
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

# --- Asincronía y HTTP ---
# `async fn` en traits ya es estable, pero un trait con async fn NO se puede
# usar como `dyn Trait`. Como toda nuestra infraestructura entra por
# `Box<dyn Almacen>`, necesitamos este macro, que reescribe el async fn a una
# función que devuelve un futuro en caja.
async-trait = "0.1.92"
# `rt-multi-thread` para usar los 6 nucleos, `macros` para #[tokio::main],
# `fs` para IO de archivos sin bloquear el runtime.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "signal", "time", "sync"] }
axum = { version = "0.8.9", features = ["multipart"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
http-body-util = "0.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# --- Utilidades ---
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
# sha2 para la huella de contenido de los archivos, hmac+hex para firmar las
# URLs temporales de subida y descarga.
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
# Runtime queries (sin macros en compile-time) para no exigir DATABASE_URL
# al desarrollar. SQLite viaja embebido: no hace falta instalar Postgres.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros"] }

# Perfil de release afinado para procesamiento intensivo.
[profile.release]
# Optimización entre unidades de compilación: más lento de compilar, binario
# más rápido. Relevante porque el worker es CPU-bound.
lto = true
codegen-units = 1
